services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: groundloop
      POSTGRES_USER: groundloop
      POSTGRES_PASSWORD: groundloop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundloop -d groundloop"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - groundloop-postgres:/var/lib/postgresql/data

volumes:
  groundloop-postgres:
